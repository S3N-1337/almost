<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка уровней</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 20px; background: #0b0914; color: #e8e6f0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #8f8aa6; margin-bottom: 18px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 24px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #221d33; white-space: nowrap; }
  th { color: #8f8aa6; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .ok { color: #5dff9a; font-weight: 700; }
  .bad { color: #ff4d6d; font-weight: 700; }
  .warn { color: #ffcc4d; }
  .lvl { margin: 0 0 26px; }
  .lvl h2 { font-size: 15px; margin: 0 0 6px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .lvl h2 a { color: #8fd8ff; font-size: 13px; font-weight: 500; }
  .scroll { overflow-x: auto; background: #07060d; border: 1px solid #221d33; border-radius: 8px; }
  canvas { display: block; }
  .note { color: #8f8aa6; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<h1>Проверка уровней</h1>
<div class="sub">«Робот» перебирает все моменты нажатий и проверяет, можно ли пройти уровень.
  <b>Окно</b> — сколько миллисекунд у игрока на нажатие: чем меньше, тем сложнее (меньше 40 мс — почти нереально).</div>
<table id="table">
  <thead><tr><th>№</th><th>Название</th><th>Скорость</th><th>Длина</th><th>Проходим?</th><th>Прыжков</th><th>Самое узкое окно</th><th>Окон &lt; 70 мс</th><th>Проверка</th></tr></thead>
  <tbody></tbody>
</table>
<div id="maps"></div>

<script src="../js/physics.js"></script>
<script src="../js/levels.js"></script>
<script src="../js/solver.js"></script>
<script>
(function () {
  var P = Physics, C = P.C;
  var tbody = document.querySelector('#table tbody');
  var maps = document.getElementById('maps');
  var results = [];

  function td(html, cls) { var e = document.createElement('td'); e.innerHTML = html; if (cls) e.className = cls; return e; }

  function simulatePath(lv, actions) {
    var s = P.newState(lv), pts = [{ x: s.x, y: s.y }], jumps = [];
    for (var i = 0; i < actions.length; i++) {
      var ev = {};
      P.step(s, lv, actions[i] === 1, actions[i] === 1, ev);
      if (ev.jump || ev.orb) jumps.push({ x: s.x, y: s.y });
      pts.push({ x: s.x, y: s.y });
      if (s.dead || s.won) break;
    }
    return { pts: pts, jumps: jumps };
  }

  function drawMap(lv, res) {
    var S = 7, top = lv.rows + 3, H = (top + 2) * S, W = lv.width * S;
    var cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    var g = cv.getContext('2d');
    var gy = function (y) { return (top - y) * S; };
    g.fillStyle = '#07060d'; g.fillRect(0, 0, W, H);
    // земля
    for (var c = 0; c < lv.width; c++) {
      g.fillStyle = lv.ground[c] ? '#2a2540' : '#3a0b16';
      g.fillRect(c * S, gy(0), S, S * 2);
    }
    // клетки
    for (var r = 0; r < lv.rows; r++) for (c = 0; c < lv.width; c++) {
      var t = P.cellAt(lv, c, r), x = c * S, y = gy(r + 1);
      if (!t) continue;
      if (t === 1) { g.fillStyle = lv.def.color || '#0ff'; g.globalAlpha = 0.8; g.fillRect(x, y, S - 1, S - 1); g.globalAlpha = 1; }
      else if (t === 2 || t === 4) { g.fillStyle = '#ff3b5c'; g.beginPath(); var h = t === 4 ? S * 0.5 : S; g.moveTo(x, y + S); g.lineTo(x + S / 2, y + S - h); g.lineTo(x + S, y + S); g.fill(); }
      else if (t === 3) { g.fillStyle = '#ff3b5c'; g.beginPath(); g.moveTo(x, y); g.lineTo(x + S / 2, y + S); g.lineTo(x + S, y); g.fill(); }
      else if (t === 5) { g.fillStyle = '#ffe23d'; g.fillRect(x + 1, y + S - 2, S - 2, 2); }
      else if (t === 6) { g.strokeStyle = '#ffe23d'; g.lineWidth = 1.5; g.beginPath(); g.arc(x + S / 2, y + S / 2, S * 0.4, 0, 7); g.stroke(); }
    }
    // финиш
    g.fillStyle = '#ffffff'; g.fillRect(lv.finishX * S, 0, 2, H);
    // путь робота
    if (res.ok) {
      var path = simulatePath(lv, res.actions);
      g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = 1.2; g.beginPath();
      path.pts.forEach(function (p, i) { var px = p.x * S, py = gy(p.y + C.SIZE / 2); if (i) g.lineTo(px, py); else g.moveTo(px, py); });
      g.stroke();
      g.fillStyle = '#5dff9a';
      path.jumps.forEach(function (j) { g.fillRect(j.x * S - 1.5, gy(j.y) - 1.5, 3, 3); });
      // узкие окна
      g.font = '10px system-ui'; g.textAlign = 'center';
      res.windows.forEach(function (w) {
        if (w.ms >= 70) return;
        g.fillStyle = w.ms < 45 ? '#ff4d6d' : '#ffcc4d';
        g.fillText(w.ms, w.x * S, 10);
      });
    } else {
      g.fillStyle = 'rgba(255,40,80,0.35)'; g.fillRect(res.farthestX * S - 2, 0, 6, H);
    }
    return cv;
  }

  LEVELS.forEach(function (def, i) {
    var lv = P.parseLevel(def, i);
    var res = Solver.solve(lv);
    results.push({ lv: lv, res: res });
    var tr = document.createElement('tr');
    var secs = (lv.finishX - lv.startX) / lv.speed;
    tr.appendChild(td(i + 1));
    tr.appendChild(td(lv.name));
    tr.appendChild(td(lv.speed));
    tr.appendChild(td(lv.mapW + ' клеток · ' + secs.toFixed(1) + ' с'));
    if (res.ok) tr.appendChild(td('да', 'ok'));
    else tr.appendChild(td('НЕТ — застревает на ' + Math.round(P.progress(lv, res.farthestX) * 100) + '% (клетка ' + Math.floor(res.farthestX - C.START_PAD) + ' от начала карты)', 'bad'));
    tr.appendChild(td(res.ok ? res.jumps : '—'));
    var minMs = res.windows.length ? Math.min.apply(null, res.windows.map(function (w) { return w.ms; })) : 0;
    var exactNoHold = res.exact.filter(function (e) { return !e.hold; }).length;
    tr.appendChild(td(res.ok ? (minMs + ' мс' + (exactNoHold ? ' <span class="warn">(+' + exactNoHold + ' «в точку»)</span>' : '')) : '—', res.ok && minMs < 40 ? 'bad' : ''));
    tr.appendChild(td(res.ok ? res.windows.filter(function (w) { return w.ms < 70; }).length : '—'));
    tr.appendChild(td(res.ms + ' мс' + (lv.warnings.length ? ' <span class="warn">⚠ ' + lv.warnings.length + '</span>' : '')));
    tbody.appendChild(tr);

    var box = document.createElement('div'); box.className = 'lvl';
    var h = document.createElement('h2');
    h.innerHTML = (i + 1) + '. ' + lv.name + ' <a href="../index.html?level=' + (i + 1) + '&autoplay=1" target="_blank">смотреть, как проходит робот →</a>';
    box.appendChild(h);
    var sc = document.createElement('div'); sc.className = 'scroll';
    sc.appendChild(drawMap(lv, res));
    box.appendChild(sc);
    if (lv.warnings.length) {
      var n = document.createElement('div'); n.className = 'note warn'; n.textContent = 'Ошибки в карте: ' + lv.warnings.join('; ');
      box.appendChild(n);
    }
    var wins = res.windows.slice().sort(function (a, b) { return a.ms - b.ms; }).slice(0, 6);
    if (res.ok) {
      var nn = document.createElement('div'); nn.className = 'note';
      nn.textContent = 'Самые точные прыжки: ' + wins.map(function (w) { return w.ms + ' мс на ' + Math.round(P.progress(lv, w.x) * 100) + '%'; }).join(', ');
      box.appendChild(nn);
    }
    maps.appendChild(box);
  });

  // для автоматической проверки
  window.__results = results.map(function (r, i) {
    var res = r.res;
    return {
      n: i + 1, ok: res.ok, secs: +((r.lv.finishX - r.lv.startX) / r.lv.speed).toFixed(1),
      far: res.ok ? 100 : Math.round(P.progress(r.lv, res.farthestX) * 100),
      farCol: Math.floor(res.farthestX - C.START_PAD),
      jumps: res.jumps,
      min: res.windows.length ? Math.min.apply(null, res.windows.map(function (w) { return w.ms; })) : 0,
      tight: res.windows.filter(function (w) { return w.ms < 70; }).length,
      exact: res.exact.filter(function (e) { return !e.hold; }).map(function (e) { return Math.floor(e.x - C.START_PAD); }),
      wins: res.windows.map(function (w) { return Math.floor(w.x - C.START_PAD) + ':' + w.ms; }).join(' '),
      warn: r.lv.warnings
    };
  });
})();
</script>
</body>
</html>
